name: collect

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dedup-cachen (redb) overlever mellom kjøringer via actions/cache,
      # så samme artikkel aldri oppsummeres to ganger
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dedup-${{ github.run_id }}
          restore-keys: dedup-

      # Forrige kjørings data hentes fra KV som fallback-kilde — data
      # committes ikke til git (persondata skal aldri innom repoet)
      - name: Hent forrige data fra KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            mkdir -p data
            curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$CLOUDFLARE_KV_NAMESPACE_ID/values/latest.json" \
              -o data/latest.json || echo "ingen tidligere data i KV"
          fi

      - name: Kjør collector
        run: cargo run --release -p collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEPUSH_TOKEN: ${{ secrets.SEPUSH_TOKEN }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PROJECT: CapeTasks
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      - name: Last opp til KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            curl -sf -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-binary @data/latest.json \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$CLOUDFLARE_KV_NAMESPACE_ID/values/latest.json"
          fi
