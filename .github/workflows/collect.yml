name: collect

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dedup-cachen (redb) overlever mellom kjøringer via actions/cache,
      # så samme artikkel aldri oppsummeres to ganger
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dedup-${{ github.run_id }}
          restore-keys: dedup-

      - name: Kjør collector
        run: cargo run --release -p collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEPUSH_TOKEN: ${{ secrets.SEPUSH_TOKEN }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: oppdater latest.json"
          file_pattern: data/latest.json
